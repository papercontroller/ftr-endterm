apiVersion: v1
kind: ConfigMap
metadata:
  name: uis-config
  namespace: uis-system
data:
  STUDENT_SERVICE_URL: "http://student-service:8081"
  PAYMENT_SERVICE_URL: "http://payment-service:8082"
  ACADEMIC_SERVICE_URLS: "http://academic-service:8083"
  DB_HOST: "uis-postgres-service"
  DB_PORT: "5432"
  DB_NAME: "uis_db"
---
# The Secret is not stored in git. Create it with your own values:
#   kubectl -n uis-system create secret generic uis-secrets \
#     --from-literal=DB_USER=uis_user --from-literal=DB_PASSWORD=... \
#     --from-literal=JWT_SECRET=... --from-literal=DEMO_PASSWORD=... \
#     --from-literal=DB_CONN=postgres://uis_user:...@uis-postgres-service:5432/uis_db?sslmode=disable
